server:
  port: 8084

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/company}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  liquibase:
    change-log: classpath:db/auth/auth-001-create-app-users.xml
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET}
    ttl-minutes: ${JWT_TTL_MINUTES}
  # Пароли только для первичного создания пользователей.
  seed:
    admin-password: ${ADMIN_PASSWORD}
    user-password: ${USER_PASSWORD}
    service-password: ${REPORT_SERVICE_PASSWORD}

gateway:
  url: ${GATEWAY_URL:http://localhost:8080}

instance:
  id: ${HOSTNAME:local}

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
