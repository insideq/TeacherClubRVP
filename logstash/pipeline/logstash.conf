input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [traceId] {
    mutate {
      add_field => { "[trace][id]" => "%{[traceId]}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-%{[service]}-%{+YYYY.MM.dd}"
    action => "create"
  }
  stdout { codec => rubydebug }
}