services:
  postgres:
    image: postgres:16
    container_name: company_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - company-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rvp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rvp}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # веб-консоль
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - company-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GATEWAY_URL: http://gateway:8080
      JWT_SECRET: ${JWT_SECRET:-rvplab-super-secret-key-for-hs256-at-least-32-bytes}
      # Пароли используются только при первом создании пользователей в БД
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      USER_PASSWORD: ${USER_PASSWORD:-user}
      REPORT_SERVICE_PASSWORD: ${REPORT_SERVICE_PASSWORD:-report-service}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: "-javaagent:/app/apm-agent.jar"
      ELASTIC_APM_SERVICE_NAME: auth-service
      ELASTIC_APM_SERVER_URL: http://apm-server:8200
      ELASTIC_APM_SECRET_TOKEN: secret
      ELASTIC_APM_ENVIRONMENT: dev
      ELASTIC_APM_APPLICATION_PACKAGES: com.example
    volumes:
      - ./apm-agent.jar:/app/apm-agent.jar:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 40s
    networks:
      - company-network

  teacher-service:
    build:
      context: ./teacherrvp
      dockerfile: dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GATEWAY_URL: http://gateway:8080
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      ELASTIC_APM_SERVICE_NAME: teacher-service
      ELASTIC_APM_SERVER_URL: http://apm-server:8200
      ELASTIC_APM_SECRET_TOKEN: secret
      ELASTIC_APM_ENVIRONMENT: dev
      ELASTIC_APM_APPLICATION_PACKAGES: com.example
      JAVA_TOOL_OPTIONS: "-javaagent:/app/apm-agent.jar"
    volumes:
      - ./apm-agent.jar:/app/apm-agent.jar:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 40s
    networks:
      - company-network

  report-service:
    build:
      context: ./report-service
      dockerfile: dockerfile
    environment:
      TEACHER_SERVICE_URL: http://gateway:8080
      FILE_STORAGE_URL: http://gateway:8080
      GATEWAY_URL: http://gateway:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-rvp}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rvp}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      SERVICE_AUTH_URL: http://gateway:8080/api/auth/login
      SERVICE_AUTH_USER: report-service
      SERVICE_AUTH_PASSWORD: ${REPORT_SERVICE_PASSWORD:-report-service}
      ELASTIC_APM_SERVICE_NAME: report-service
      ELASTIC_APM_SERVER_URL: http://apm-server:8200
      ELASTIC_APM_SECRET_TOKEN: secret
      ELASTIC_APM_ENVIRONMENT: dev
      ELASTIC_APM_APPLICATION_PACKAGES: com.example
      JAVA_TOOL_OPTIONS: "-javaagent:/app/apm-agent.jar"
    volumes:
      - ./apm-agent.jar:/app/apm-agent.jar:ro
    depends_on:
      - gateway
      - rabbitmq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 40s
    networks:
      - company-network

  gateway:
    build:
      context: ./gateway
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-rvplab-super-secret-key-for-hs256-at-least-32-bytes}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      ELASTIC_APM_SERVICE_NAME: gateway
      ELASTIC_APM_SERVER_URL: http://apm-server:8200
      ELASTIC_APM_SECRET_TOKEN: secret
      ELASTIC_APM_ENVIRONMENT: dev
      ELASTIC_APM_APPLICATION_PACKAGES: com.example
      JAVA_TOOL_OPTIONS: "-javaagent:/app/apm-agent.jar"
    volumes:
      - ./apm-agent.jar:/app/apm-agent.jar:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - company-network

  # --- Кластер MinIO: 4 ноды = 4 "диска" в одном erasure-наборе (2 данных + 2 чётности) ---
  minio1:
    image: elestio/minio:latest
    container_name: minio1
    user: root
    command: server --address ":9000" --console-address ":9001" http://minio{1...4}:9000/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio1_data:/data
    networks:
      - company-network

  minio2:
    image: elestio/minio:latest
    container_name: minio2
    user: root
    command: server --address ":9000" --console-address ":9001" http://minio{1...4}:9000/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio2_data:/data
    networks:
      - company-network

  minio3:
    image: elestio/minio:latest
    container_name: minio3
    user: root
    command: server --address ":9000" --console-address ":9001" http://minio{1...4}:9000/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio3_data:/data
    networks:
      - company-network

  minio4:
    image: elestio/minio:latest
    container_name: minio4
    user: root
    command: server --address ":9000" --console-address ":9001" http://minio{1...4}:9000/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio4_data:/data
    networks:
      - company-network

  file-storage-service:
    build:
      context: ./file-storage-service
      dockerfile: dockerfile
    environment:
      GATEWAY_URL: http://gateway:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-rvp}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rvp}
      S3_ENDPOINTS: http://minio1:9000,http://minio2:9000,http://minio3:9000,http://minio4:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: reports
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: "-javaagent:/app/apm-agent.jar"
      ELASTIC_APM_SERVICE_NAME: file-storage-service
      ELASTIC_APM_SERVER_URL: http://apm-server:8200
      ELASTIC_APM_SECRET_TOKEN: secret
      ELASTIC_APM_ENVIRONMENT: dev
      ELASTIC_APM_APPLICATION_PACKAGES: com.example
    volumes:
      - ./apm-agent.jar:/app/apm-agent.jar:ro
    depends_on:
      - gateway
      - rabbitmq
      - minio1
      - minio2
      - minio3
      - minio4
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 40s
    networks:
      - company-network

  # --- Наблюдаемость: Zipkin для трейсов, Prometheus для метрик ---
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - company-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - gateway
    networks:
      - company-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - company-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: logstash
    ports:
      - "5000:5000"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - company-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - company-network

  apm-server:
    image: docker.elastic.co/apm/apm-server:8.15.0
    container_name: apm-server
    ports:
      - "8200:8200"
    environment:
      - output.elasticsearch.hosts=["http://elasticsearch:9200"]
      - apm-server.host=0.0.0.0:8200
      - apm-server.secret_token=secret
      - apm-server.rum.enabled=true
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - company-network

networks:
  company-network:
    driver: bridge

volumes:
  postgres_data:
  elasticsearch_data:
  rabbitmq_data:
  prometheus_data:
  minio1_data:
  minio2_data:
  minio3_data:
  minio4_data: