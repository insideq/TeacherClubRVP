server:
  port: 8082

spring:
  application:
    name: report-service

instance:
  id: ${HOSTNAME:local}

gateway:
  url: ${GATEWAY_URL:http://localhost:8080}

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

teacher-service:
  url: ${TEACHER_SERVICE_URL:http://localhost:8080}

file-storage:
  url: ${FILE_STORAGE_URL:http://localhost:8080}