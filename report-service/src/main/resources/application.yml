server:
  port: 8082

spring:
  application:
    name: report-service

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

instance:
  id: ${HOSTNAME:local}

gateway:
  url: ${GATEWAY_URL:http://localhost:8080}

queue:
  reports:
    confirm-timeout-seconds: ${QUEUE_CONFIRM_TIMEOUT:5}

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

teacher-service:
  url: ${TEACHER_SERVICE_URL:http://localhost:8080}

file-storage:
  url: ${FILE_STORAGE_URL:http://localhost:8080}

# Служебная учётная запись: report-service логинится в гейтвей
service-auth:
  login-url: ${SERVICE_AUTH_URL:http://localhost:8080/api/auth/login}
  username: ${SERVICE_AUTH_USER:report-service}
  password: ${SERVICE_AUTH_PASSWORD:report-service}
