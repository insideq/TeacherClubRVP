plugins {
	// Обычная библиотека без Spring: чистый параллельный алгоритм, который можно
	// подключить к любому сервису через implementation project(':merge-sort-lib')
	id 'java-library'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

tasks.named('test') {
	useJUnitPlatform()
}
